<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charSet="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <title>Site en maintenance • Site under maintenance</title>
    <meta name="description" content="Raphaël Doursenaud's Web Space is currently under maintenance."/>

    <link rel="icon" href="images/favicon.png"/>
    <link rel="preload" as="image" href="images/favicon.svg"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.css"/>

    <style>
        :root {
            --myst-bg: #0f172a;
            --myst-text: #f8fafc;
            --myst-text-secondary: #94a3b8;
            --myst-border: #334155;
            --myst-surface: #1e293b;
            --myst-active: #38bdf8;
        }

        html {
            font-family: ui-sans-serif,system-ui,sans-serif,Apple Color Emoji,Segoe UI Emoji,Segoe UI Symbol,Noto Color Emoji;
            background-color: var(--myst-bg);
            color: var(--myst-text);
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            line-height: 1.5;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
            animation: fadeIn 0.8s ease-out;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 1rem 0 0.5rem 0;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.125rem;
            color: var(--myst-text-secondary);
            margin-bottom: 2rem;
            display: block;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            background-color: var(--myst-surface);
            border: 1px solid var(--myst-border);
            border-radius: 9999px;
            font-size: 0.875rem;
            color: var(--myst-active);
            margin-bottom: 1.5rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .logo-container {
            margin-bottom: 1.5rem;
            opacity: 0.9;
            transition: opacity 0.3s;
        }

        .logo-container:hover {
            opacity: 1;
        }

        .logo-img {
            height: 80px;
            width: auto;
        }

        .footer-links {
            margin-top: 3rem;
            padding-top: 2rem;
            border-top: 1px solid var(--myst-border);
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .footer-links a {
            color: var(--myst-text-secondary);
            text-decoration: none;
            font-size: 0.875rem;
            transition: color 0.2s, transform 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .footer-links a:hover {
            color: var(--myst-active);
            transform: translateY(-2px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            h1 { font-size: 1.875rem; }
            .container { padding: 1.5rem; }
            .footer-links { flex-direction: column; gap: 1rem; }
            .logo-img { height: 64px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo-container">
            <img src="images/favicon.svg" alt="Raphaël Doursenaud's Web Space" class="logo-img">
            <span class="subtitle">Expériences ◆ Experiments</span>

        </div>

        <div class="badge">Maintenance</div>

        <h1>
            Mise à jour des Expériences.
            <span class="subtitle">Updating Experiments.</span>
        </h1>

        <p style="color: var(--myst-text-secondary); font-size: 1.125rem; max-width: 480px; margin: 0 auto 2rem auto;">
            Merci de repasser plus tard.<br>
            <span style="font-size: 0.9em; opacity: 0.8;">Please come back later.</span>
        </p>

        <div class="footer-links">
            <a href="https://refuge.coop" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-users"></i> Refuge.coop
            </a>
            <a href="https://gpcsolutions.fr" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-cloud"></i> GPC.solutions SAS
            </a>
            <a href="https://ematech.fr" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-microchip"></i> EMA Tech.
            </a>
            <a href="https://gitlab.com/rdoursenaud" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-gitlab"></i> GitLab
            </a>
            <a href="https://github.com/rdoursenaud" target="_blank" rel="noopener noreferrer">
                <i class="fa fa-github"></i> GitHub
            </a>
        </div>

        <div style="margin-top: 2rem; padding-top: 1.5rem; display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
            <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer" title="Creative Commons Attribution Share Alike 4.0 International">
                <img src="https://mirrors.creativecommons.org/presskit/icons/cc.svg" alt="CC" style="height: 1.25rem; width: auto; vertical-align: middle; opacity: 0.6;">
                <img src="https://mirrors.creativecommons.org/presskit/icons/by.svg" alt="BY" style="height: 1.25rem; width: auto; vertical-align: middle; opacity: 0.6;">
                <img src="https://mirrors.creativecommons.org/presskit/icons/sa.svg" alt="SA" style="height: 1.25rem; width: auto; vertical-align: middle; opacity: 0.6;">
            </a>
        </div>
    </div>
</body>
</html>
